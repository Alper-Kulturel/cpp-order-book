name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pybind11 is what CMakeLists discovers through `python -m pybind11
      # --cmakedir`, so it has to be installed into the interpreter that
      # setup-python selected.
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip pybind11 pytest

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # The build copies order_book_cpp and bench_driver into python/, which is
      # where tests/conftest.py looks for them.
      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: python -m pytest tests/ -v
