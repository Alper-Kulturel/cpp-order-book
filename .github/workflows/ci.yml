name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run instead of stacking up behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned instead of ubuntu-latest: that label migrates to Ubuntu 26 on
    # 2026-10-19, and moving images should be a deliberate change rather than
    # something that lands unannounced.
    runs-on: ubuntu-24.04
    # Bounds a hung build or test step. The suite itself runs in about a second.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pybind11 is what CMakeLists discovers through `python -m pybind11
      # --cmakedir`, so it has to be installed into the interpreter that
      # setup-python selected.
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip pybind11 pytest

      # CMake's own Python3 search does not always land on the interpreter that
      # is first on PATH -- it can pick a system or framework install instead,
      # and the pybind11 lookup then fails against the wrong site-packages.
      # Naming the interpreter explicitly keeps the build pinned to the one we
      # just installed pybind11 into.
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"

      # The build copies order_book_cpp and bench_driver into python/, which is
      # where tests/conftest.py looks for them.
      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: python -m pytest tests/ -v
